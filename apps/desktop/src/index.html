<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Homerun</title>
    <style>
      body { font: 14px -apple-system, system-ui, sans-serif; margin: 24px; }
      button { margin: 4px 4px 4px 0; }
      pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; max-height: 320px; overflow: auto; }
    </style>
  </head>
  <body>
    <h2>Homerun <small>milestone 0 spike · powered by Claude</small></h2>
    <div>
      <button data-rt="ping">Ping runtime</button>
      <button data-rt="run.list">List runs</button>
      <button data-rt="mcp.probe">Probe MCP (Node + uv)</button>
      <button data-rt="keychain.get">Keychain get</button>
    </div>
    <div>
      <button data-login="status">Login item status</button>
      <button data-login="register">Register login item</button>
      <button data-login="unregister">Unregister</button>
      <button id="update">Check for update</button>
    </div>
    <div>
      <input id="prompt" size="60" value="Run `sleep 5 && echo hi` with Bash, then say done." />
      <button id="run">Start run</button>
    </div>
    <pre id="out">ready</pre>
    <script src="main.js"></script>
  </body>
</html>
