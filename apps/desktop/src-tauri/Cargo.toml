[package]
name = "homerun"
version = "0.0.1"
edition = "2021"

[workspace]
members = [".", "shell-core"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
homerun-shell-core = { path = "shell-core" }
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-single-instance = "=2.5.0"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSNotification", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "block2"] }
block2 = "0.6"
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
