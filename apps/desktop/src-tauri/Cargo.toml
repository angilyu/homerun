[package]
name = "homerun"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-shell = "=2.4.0"
tauri-plugin-single-instance = "=2.5.0"
tauri-plugin-updater = "=2.13.0"
tauri-plugin-process = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = { version = "0.3", features = ["SMAppService"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
