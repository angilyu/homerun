name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: packages/core and packages/client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Packages resolve from registry.npmjs.org only
        run: scripts/check-registry.sh
      # Root devDependency `bun` pins the Bun version used by `bun test`.
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/core..." --filter "@homerun/client..." --filter "@homerun/win32" --filter "@homerun/homerund"
      - name: Typecheck
        run: pnpm --filter @homerun/core --filter @homerun/client --filter @homerun/win32 --filter @homerun/homerund typecheck
      - name: Test
        run: pnpm --filter @homerun/core --filter @homerun/client --filter @homerun/win32 test
      - name: Generated JSON Schema and vectors are up to date
        run: pnpm --filter @homerun/core schema:check
      - name: Markdown links and anchors resolve
        run: pnpm check:doc-links

  protocol:
    name: packages/protocol and packages/testkit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/protocol..." --filter "@homerun/testkit..."
      - name: Typecheck
        run: pnpm --filter @homerun/protocol --filter @homerun/testkit typecheck
      # Noise against the cacophony vectors, then every protocol vector, positive and negative (§16.2).
      - name: Test
        run: pnpm --filter @homerun/protocol --filter @homerun/testkit test
      - name: Protocol test vectors are up to date
        run: pnpm --filter @homerun/protocol vectors:check

  relay:
    name: apps/relay and packages/remote
    # The relay under Bun and under workerd (wrangler's local runtime, driven from Node), then the
    # reference client end to end against it. No Cloudflare account, WorkOS or APNs is involved.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/relay..." --filter "@homerun/remote..."
      - name: Typecheck (Bun adapter and the Worker)
        run: pnpm --filter @homerun/relay --filter @homerun/remote typecheck
      - name: Relay under Bun
        run: pnpm --filter @homerun/relay test
      - name: Relay under workerd, and the vectors inside a Worker
        run: pnpm --filter @homerun/relay test:workerd
      - name: Reference client end to end
        run: pnpm --filter @homerun/remote test

  homerund:
    name: apps/homerund
    # Linux: the runtime's process-group, ps and socket code is POSIX, and the SDK ships a
    # linux-x64 claude (in the lockfile), so replay runs the real bundled claude here too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/homerund..." --filter "@homerun/spike-sdk" --filter "@homerun/spike-homerund-m0"
      - name: No secrets in the repository
        run: scripts/check-no-secrets.sh
      - name: Typecheck (homerund and the milestone 0 spikes it replaced)
        run: pnpm --filter @homerun/homerund --filter @homerun/spike-sdk --filter @homerun/spike-homerund-m0 typecheck
      - name: Unit tests
        run: pnpm --filter @homerun/homerund test:unit
      # Recorded cassettes, real bundled claude, no API key and no network to the API (§16.2).
      - name: Replay tests
        run: pnpm --filter @homerun/homerund test:replay
        env:
          ANTHROPIC_API_KEY: ""

  remote-e2e:
    name: Remote access end to end
    # The desktop runtime (fake engine, no API spend) signs in against a local OIDC issuer, links
    # through the relay's Bun adapter, and a reference-client phone or browser pairs, opens live
    # sessions, sends sealed instructions and answers pushes from a mock APNs (§9, §10, §16.2).
    # About 10 seconds of tests. nightly.yml runs the same suite against workerd, and on Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/homerund..."
      - name: Runtime, relay and reference client
        run: pnpm --filter @homerun/homerund test:remote

  homerund-crash:
    name: apps/homerund crash tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/homerund..."
      # Kill homerund at a sample of event boundaries and resume, with a simulated claude (§16.2).
      # The sample covers every kind of boundary and changes with each commit (seeded from
      # GITHUB_SHA; the log prints the seed). nightly.yml kills at every boundary.
      - name: Crash tests (sampled)
        run: pnpm --filter @homerun/homerund test:crash
        env:
          HOMERUN_CRASH_SWEEP: sample

  cli:
    name: apps/cli
    # The CLI's end-to-end and replay tests start homerund (from source, and its bundled linux-x64
    # claude for replay), so this job installs homerund's dependencies too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/cli..."
      - name: Typecheck
        run: pnpm --filter @homerun/cli typecheck
      - name: Unit tests
        run: pnpm --filter @homerun/cli test:unit
      # homerund with the fake engine, the CLI spawned from source; the build gate compiles both builds.
      - name: End-to-end tests
        run: pnpm --filter @homerun/cli test:e2e
      # homerund's recorded cassettes, real bundled claude, no API key (§16.2).
      - name: Replay tests
        run: pnpm --filter @homerun/cli test:replay
        env:
          ANTHROPIC_API_KEY: ""

  desktop:
    name: packages/app-state and the desktop UI
    # The platform-neutral client state layer (§9.8) and the React DOM views over it (plan §9).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/app-state..." --filter "@homerun/desktop..."
      - name: Typecheck
        run: pnpm --filter @homerun/app-state --filter @homerun/desktop typecheck
      - name: State layer tests
        run: pnpm --filter @homerun/app-state test
      - name: Component tests
        run: pnpm --filter @homerun/desktop test
      - name: Web build
        run: pnpm --filter @homerun/desktop build

  desktop-e2e:
    name: apps/desktop end-to-end
    # The production views in a browser, over a bridge that stands in for the Tauri shell, against
    # a real homerund: the fake engine, and recorded cassettes with the real bundled linux-x64
    # claude (§16.2). The CLI access test runs apps/cli from source, so @homerun/cli is a
    # devDependency of the desktop app and this filtered install brings its modules. WKWebView
    # and the Rust shell itself are covered by the macOS checklist in apps/desktop/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/desktop..."
      # The runner image's Google Chrome, so there is no browser download.
      - name: End-to-end tests
        run: pnpm --filter @homerun/desktop test:e2e
        env:
          ANTHROPIC_API_KEY: ""
          HOMERUN_E2E_CHANNEL: chrome
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e
          path: |
            apps/desktop/test/e2e/report
            apps/desktop/test/e2e/results
          retention-days: 7

  shell:
    name: apps/desktop shell supervisor
    # The platform-neutral half of the Tauri shell (supervisor, launch-token connection, webview
    # forwarding allowlist, §5.1–§5.2). It depends on serde only, so it builds in seconds; the Tauri
    # crate itself (WebKit and AppKit, or WebView2 and Win32) builds nightly on macOS and Windows
    # (nightly.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Supervisor tests
        working-directory: apps/desktop/src-tauri
        run: cargo test -p homerun-shell-core --locked

  windows-runtime:
    name: Windows runtime, CLI and client
    # The runtime's named pipe (private DACL, §5.2), job objects, keep-awake, claude's environment
    # and the Windows denylist; the client's pipe endpoint; the CLI's peer check against a real
    # pipe and its Credential Manager token store; and the win32 FFI they share. The cross-user
    # test creates a throwaway local user (the runner is an administrator) and expects every open
    # of the pipe, the endpoint and the dev token to be denied. About 2 minutes. The CLI's end-to-end
    # tests and a sampled crash sweep run nightly on Windows (nightly.yml, windows-full); replay
    # stays on Linux (§18 row 69).
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/homerund..." --filter "@homerun/cli..."
      # Each suite runs even when an earlier one failed, so one failure doesn't hide another; any
      # failure still fails the job.
      - name: win32 FFI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @homerun/win32 test
      - name: Client
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @homerun/client test
      - name: Runtime unit tests (with the cross-user pipe test)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @homerun/homerund test:unit
        env:
          HOMERUN_WIN_CROSS_USER: "1"
      - name: CLI unit tests (with the Authenticode peer check against PowerShell 7)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @homerun/cli test:unit

  windows-shell:
    name: Windows shell supervisor
    # shell-core on Windows: the pipe client's server-pid check, overlapped I/O, the shell's job
    # object, BCryptGenRandom, and the supervisor against the fake runtime. The Tauri crate itself
    # builds nightly on Windows (nightly.yml). Warnings fail here because the Windows-only code
    # compiles nowhere else per pull request.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      # Saving the cache takes about 40 s on Windows, so only main saves it; pull requests restore.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Supervisor tests
        working-directory: apps/desktop/src-tauri
        run: cargo test -p homerun-shell-core --locked
        env:
          RUSTFLAGS: -D warnings
