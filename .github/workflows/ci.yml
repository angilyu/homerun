name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: packages/core and packages/client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Packages resolve from registry.npmjs.org only
        run: scripts/check-registry.sh
      # Root devDependency `bun` pins the Bun version used by `bun test`.
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/core..." --filter "@homerun/client..." --filter "@homerun/homerund"
      - name: Typecheck
        run: pnpm --filter @homerun/core --filter @homerun/client --filter @homerun/homerund typecheck
      - name: Test
        run: pnpm --filter @homerun/core --filter @homerun/client test
      - name: Generated JSON Schema and vectors are up to date
        run: pnpm --filter @homerun/core schema:check
      - name: Markdown links and anchors resolve
        run: pnpm check:doc-links

  homerund:
    name: apps/homerund
    # Linux: the runtime's process-group, ps and socket code is POSIX, and the SDK ships a
    # linux-x64 claude (in the lockfile), so replay runs the real bundled claude here too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/homerund..." --filter "@homerun/spike-sdk" --filter "@homerun/spike-homerund-m0"
      - name: No secrets in the repository
        run: scripts/check-no-secrets.sh
      - name: Typecheck (homerund and the milestone 0 spikes it replaced)
        run: pnpm --filter @homerun/homerund --filter @homerun/spike-sdk --filter @homerun/spike-homerund-m0 typecheck
      - name: Unit tests
        run: pnpm --filter @homerun/homerund test:unit
      # Recorded cassettes, real bundled claude, no API key and no network to the API (§16.2).
      - name: Replay tests
        run: pnpm --filter @homerun/homerund test:replay
        env:
          ANTHROPIC_API_KEY: ""

  homerund-crash:
    name: apps/homerund crash tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/homerund..."
      # Kill homerund at a sample of event boundaries and resume, with a simulated claude (§16.2).
      # The sample covers every kind of boundary and changes with each commit (seeded from
      # GITHUB_SHA; the log prints the seed). nightly.yml kills at every boundary.
      - name: Crash tests (sampled)
        run: pnpm --filter @homerun/homerund test:crash
        env:
          HOMERUN_CRASH_SWEEP: sample

  cli:
    name: apps/cli
    # The CLI's end-to-end and replay tests start homerund (from source, and its bundled linux-x64
    # claude for replay), so this job installs homerund's dependencies too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/cli..."
      - name: Typecheck
        run: pnpm --filter @homerun/cli typecheck
      - name: Unit tests
        run: pnpm --filter @homerun/cli test:unit
      # homerund with the fake engine, the CLI spawned from source; the build gate compiles both builds.
      - name: End-to-end tests
        run: pnpm --filter @homerun/cli test:e2e
      # homerund's recorded cassettes, real bundled claude, no API key (§16.2).
      - name: Replay tests
        run: pnpm --filter @homerun/cli test:replay
        env:
          ANTHROPIC_API_KEY: ""

  desktop:
    name: packages/app-state and the desktop UI
    # The platform-neutral client state layer (§9.8) and the React DOM views over it (plan §9).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/app-state..." --filter "@homerun/desktop..."
      - name: Typecheck
        run: pnpm --filter @homerun/app-state --filter @homerun/desktop typecheck
      - name: State layer tests
        run: pnpm --filter @homerun/app-state test
      - name: Component tests
        run: pnpm --filter @homerun/desktop test
      - name: Web build
        run: pnpm --filter @homerun/desktop build

  desktop-e2e:
    name: apps/desktop end-to-end
    # The production views in a browser, over a bridge that stands in for the Tauri shell, against
    # a real homerund: the fake engine, and recorded cassettes with the real bundled linux-x64
    # claude (§16.2). WKWebView and the Rust shell itself are covered by the macOS checklist in
    # apps/desktop/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/desktop..."
      # The runner image's Google Chrome, so there is no browser download.
      - name: End-to-end tests
        run: pnpm --filter @homerun/desktop test:e2e
        env:
          ANTHROPIC_API_KEY: ""
          HOMERUN_E2E_CHANNEL: chrome
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e
          path: |
            apps/desktop/test/e2e/report
            apps/desktop/test/e2e/results
          retention-days: 7

  shell:
    name: apps/desktop shell supervisor
    # The platform-neutral half of the Tauri shell (supervisor, launch-token connection, webview
    # forwarding allowlist, §5.1–§5.2). It depends on serde only, so it builds in seconds; the Tauri
    # crate itself (WebKit, AppKit) builds nightly on macOS (nightly.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Supervisor tests
        working-directory: apps/desktop/src-tauri
        run: cargo test -p homerun-shell-core --locked
