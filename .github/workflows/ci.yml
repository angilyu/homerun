name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: packages/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Root devDependency `bun` pins the Bun version used by `bun test`.
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/core..." --filter "@homerun/homerund"
      - name: Typecheck
        run: pnpm --filter @homerun/core --filter @homerun/homerund typecheck
      - name: Test
        run: pnpm --filter @homerun/core test
      - name: Generated JSON Schema and vectors are up to date
        run: pnpm --filter @homerun/core schema:check

  homerund:
    name: apps/homerund
    # Linux: the runtime's process-group, ps and socket code is POSIX, and the SDK ships a
    # linux-x64 claude (in the lockfile), so replay runs the real bundled claude here too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter homerun --filter "@homerun/homerund..." --filter "@homerun/spike-sdk" --filter "@homerun/spike-homerund-m0"
      - name: No secrets in the repository
        run: scripts/check-no-secrets.sh
      - name: Typecheck (homerund and the milestone 0 spikes it replaced)
        run: pnpm --filter @homerun/homerund --filter @homerun/spike-sdk --filter @homerun/spike-homerund-m0 typecheck
      - name: Unit tests
        run: pnpm --filter @homerun/homerund test:unit
      # Recorded cassettes, real bundled claude, no API key and no network to the API (§16.2).
      - name: Replay tests
        run: pnpm --filter @homerun/homerund test:replay
        env:
          ANTHROPIC_API_KEY: ""
